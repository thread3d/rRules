[package]
name = "db_tests"
version = "9.0.86"
edition = "2021"
publish = false

# The API's database-backed tests live in their own crate on purpose.
#
# They are the proof that `DMN_PERSISTENCE`, `AUDIT_PERSISTENCE` and `TENANT_PERSISTENCE` really wire
# PostgreSQL into the handlers, and they start a real server with `pg-embed`. While they sat in
# `api/tests/`, `pg-embed` was an `api` **dev-dependency**, so every build and coverage pass of the API
# compiled that tree — and the requirement verification, which builds the crate and measures it,
# began exhausting its budget and reporting all 35 requirements BLOCKED. A test that makes the gate
# that verifies everything else stop working is in the wrong crate.

[dependencies]
api = { path = "../api", features = ["postgres"] }
engine = { path = "../engine" }
engine_state = { path = "../engine_state", features = ["postgres"] }

[dev-dependencies]
actix-web = { version = "4", features = ["macros"] }
actix-http = "3"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
pg-embed = "1.0.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }

# Its own workspace: `exclude`d from the parent, so a workspace build never sees `pg-embed`.
[workspace]
