apiVersion: v1
kind: ConfigMap
metadata:
  name: rrules-config
  namespace: default
data:
  # Every key here is read by the server; `make deploy-env` fails on one that is not.
  RUST_LOG: "info"

  # Rule and DMN storage
  RULE_STORAGE_PATH: "/app/rules"
  DMN_STORAGE_PATH: "/app/dmn"

  # Networking: the server reads RRULES_BIND_ADDRESS and PORT, not SERVER_HOST/SERVER_PORT.
  RRULES_BIND_ADDRESS: "0.0.0.0"
  PORT: "8080"

  # Hot reload
  WATCH_RULES_DIR: "true"

  # Browser origins allowed to call the API (comma-separated, pinned — never a wildcard).
  CORS_ALLOWED_ORIGINS: ""
