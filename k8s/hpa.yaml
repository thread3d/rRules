apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rrules-hpa
  namespace: default
  labels:
    app: rrules
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rrules-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    # CPU utilization target
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Memory utilization target
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
