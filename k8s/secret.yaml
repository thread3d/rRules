apiVersion: v1
kind: Secret
metadata:
  name: rrules-secrets
  namespace: default
type: Opaque
stringData:
  # Override this. The server falls back to a public development string when the variable is
  # absent, which makes every token forgeable; `make deploy-env` fails while it is unset here.
  #
  #   kubectl create secret generic rrules-secrets \
  #     --from-literal=API_SECRET_KEY="$(openssl rand -base64 32)" \
  #     --dry-run=client -o yaml | kubectl apply -f -
  API_SECRET_KEY: "replace-me-with-a-generated-secret"
