apiVersion: v1
kind: ServiceAccount
metadata:
  name: rrules-service-account
  namespace: default
  labels:
    app: rrules
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rrules-role
  namespace: default
  labels:
    app: rrules
rules:
  # Allow reading ConfigMaps and Secrets for configuration
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  # Allow reading pods for service discovery
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rrules-role-binding
  namespace: default
  labels:
    app: rrules
subjects:
  - kind: ServiceAccount
    name: rrules-service-account
    namespace: default
roleRef:
  kind: Role
  name: rrules-role
  apiGroup: rbac.authorization.k8s.io
