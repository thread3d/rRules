apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rrules-ingress
  namespace: default
  labels:
    app: rrules
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: rrules.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rrules-service
                port:
                  number: 8080
