apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rrules
  labels:
    app: {{ .Release.Name }}-rrules
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-rrules
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
