{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-rrules
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.hosts.first.host | default "rrules.example.com" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-rrules
                port:
                  number: {{ .Values.service.port }}
{{- end }}
