apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

namespace: default

commonLabels:
  app: rrules

images:
  - name: rrules/server
    newTag: v0.1.0

configMapGenerator:
  - name: rrules-config
    files:
      - config/production.yaml
