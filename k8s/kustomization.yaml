apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

namespace: default

commonLabels:
  app: rrules

images:
  - name: rrules/server
    newTag: 9.0.0

configMapGenerator:
  - name: rrules-config
    files:
      - config/production.yaml
