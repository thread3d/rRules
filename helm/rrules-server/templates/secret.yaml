{{- /*
  API_SECRET_KEY. The server falls back to a public development string when the variable is
  absent, so the chart never runs without one: an explicit value wins, otherwise one is generated
  and *kept* across upgrades by reading the existing Secret first (the `lookup` pattern — without
  it every `helm upgrade` would rotate the key and invalidate every issued token).
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "rrules-server.fullname" .) -}}
{{- $key := .Values.auth.apiSecretKey -}}
{{- if and (not $key) $existing -}}
{{- $key = index $existing.data "API_SECRET_KEY" | b64dec -}}
{{- end -}}
{{- if not $key -}}
{{- $key = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rrules-server.fullname" . }}
  labels:
    {{- include "rrules-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_SECRET_KEY: {{ $key | quote }}
