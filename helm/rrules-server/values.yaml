# Default values for rrules-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: rrules/server
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

securityContext:
  runAsUser: 65534
  runAsNonRoot: true
  readOnlyRootFilesystem: false

serviceAccount:
  create: true
  annotations: {}

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5

ingress:
  # The ingress template renders only when this is true; it is off by default so
  # a plain `helm install` creates a Service and nothing else.
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rrules.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

config:
  RUST_LOG: "info"
  RULE_STORAGE_PATH: "/data/rules"
  WATCH_RULES_DIR: "true"
