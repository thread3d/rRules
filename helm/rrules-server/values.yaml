# Default values for rrules-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: rrules/server
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

securityContext:
  runAsUser: 65534
  runAsNonRoot: true
  readOnlyRootFilesystem: false

serviceAccount:
  create: true
  annotations: {}

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5

ingress:
  # The ingress template renders only when this is true; it is off by default so
  # a plain `helm install` creates a Service and nothing else.
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rrules.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

config:
  RUST_LOG: "info"
  RULE_STORAGE_PATH: "/data/rules"
  DMN_STORAGE_PATH: "/data/dmn"
  WATCH_RULES_DIR: "true"
  # The server reads RRULES_BIND_ADDRESS and PORT; everything in this block is passed
  # straight through, so a key the server does not read is dead configuration — `make
  # deploy-env` fails on one.
  RRULES_BIND_ADDRESS: "0.0.0.0"
  PORT: "8080"
  # Comma-separated browser origins allowed to call the API. Empty means none.
  CORS_ALLOWED_ORIGINS: ""
  # Which store decision documents are persisted through: `filesystem` (the default) or `postgres`.
  # `postgres` needs `database.urlSecret` set; asking for it without a URL fails startup on purpose.
  DMN_PERSISTENCE: "filesystem"
  # Where the audit trail lives: `memory` (a restart empties it) or `postgres` (needs
  # `database.urlSecret`). The trail is the evidence an auditor reads, so a real deployment
  # usually wants it persisted.
  AUDIT_PERSISTENCE: "memory"
  # Where the tenant registry lives: `memory` or `postgres` (needs `database.urlSecret`).
  TENANT_PERSISTENCE: "memory"

# PostgreSQL for decision documents and the audit trail, when the matching `*_PERSISTENCE` is
# `postgres`.
# The connection string lives in a Secret you create; this chart never puts it in values.
database:
  # Name of an existing Secret holding the connection string. Empty means none is mounted.
  urlSecret: ""
  # Key inside that Secret.
  urlSecretKey: "DATABASE_URL"

auth:
  # HS256 signing key. Left empty, the chart generates one per release and reuses it on
  # upgrade; the server's own fallback is a public development string, which makes every
  # token forgeable, so leaving this empty in a real deployment is a mistake even though
  # the chart will not start with the default.
  #
  #   openssl rand -base64 32
  #
  apiSecretKey: ""
