name: Reclaim disk space
description: >
  A hosted `ubuntu-latest` runner presents about 12 GB free on a 72 GB root, because its image carries
  several GB of toolchains this project never uses — dotnet, the Android SDK, GHC, CodeQL. Every Rust
  job here compiles the workspace and `make preflight` refuses to trust a build with less than 15 GB of
  headroom, so the space is reclaimed before anything is built. The gates job once failed with "No
  space left on device" compiling chrono-tz; the Documentation job failed on f84fcc1 with
  `preflight: FAIL only 12 GB free` — a true measurement of the runner image, presented as a verdict
  on the code. Both jobs now start from the same machine.


runs:
  using: composite
  steps:
    - name: Remove toolchains this project does not use
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /
