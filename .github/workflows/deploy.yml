name: Deploy

# Builds the container image on every push to the default branch, and deploys it
# with Helm only when a kubeconfig secret is configured. Publishing an image is
# harmless without a cluster; a deploy step that fails on every push is not.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Buildx otherwise renders a progress block that is unreadable in the Actions log.
  BUILDKIT_PROGRESS: plain
  IMAGE_NAME: ${{ github.repository_owner }}/rrules-server
  HELM_CHART_PATH: helm/rrules-server
  KUBE_NAMESPACE: default
  # Exposed at job level so a step condition can test it: GitHub forbids
  # referencing `secrets` directly inside `if:`, which is why the original
  # guard never worked.
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

jobs:
  image:
    name: Build and push the container image
    runs-on: ubuntu-latest
    # The Dockerfile compiles the workspace in release mode inside the builder, so
    # a cold cache on a two-core runner is the long pole.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Provenance attestations add minutes to a build that already compiles the
          # workspace from scratch, and nothing here publishes them.
          provenance: false
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy with Helm
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint the chart
        run: helm lint "$HELM_CHART_PATH"

      - name: Render the chart with this release's values
        run: |
          helm template rrules-server "$HELM_CHART_PATH" \
            --namespace "$KUBE_NAMESPACE" \
            --set image.repository="ghcr.io/$IMAGE_NAME" \
            --set image.tag="${{ github.sha }}" > /dev/null

      - name: Configure cluster access
        if: env.KUBE_CONFIG != ''
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ env.KUBE_CONFIG }}

      - name: Explain the skip when no cluster is configured
        if: env.KUBE_CONFIG == ''
        run: |
          echo "::notice title=Deploy skipped::KUBE_CONFIG is not set for this repository, so the image was published but not deployed."

      # `KUBE_CONFIG` being present does not mean a cluster answers. Without this
      # check a stale or unreachable kubeconfig fails every push, which teaches
      # people to ignore the workflow instead of fixing the secret.
      - name: Check the cluster answers
        id: cluster
        if: env.KUBE_CONFIG != ''
        run: |
          if kubectl cluster-info --request-timeout=20s >/dev/null 2>&1; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::KUBE_CONFIG is set but the cluster did not answer within 20s. The image was published; remove the secret if this repository has no cluster."
          fi

      - name: Helm upgrade
        # Only when the cluster answered: an unreachable one is reported as a
        # warning above, because the image was still published.
        if: steps.cluster.outputs.reachable == 'true'
        run: |
          helm upgrade --install rrules-server "$HELM_CHART_PATH" \
            --namespace "$KUBE_NAMESPACE" \
            --create-namespace \
            --set image.repository="ghcr.io/$IMAGE_NAME" \
            --set image.tag="${{ github.sha }}" \
            --set image.pullPolicy=Always \
            --wait \
            --timeout 300s
