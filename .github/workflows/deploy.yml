name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: rrules/server
  HELM_CHART_PATH: helm/rrules-server
  KUBE_NAMESPACE: default

jobs:
  deploy:
    name: Build & Deploy to Kubernetes
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rrules-server:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/rrules-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Install kubectl and configure cluster access
        uses: azure/k8s-set-context@v3
        if: ${{ secrets.KUBE_CONFIG != '' }}
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install rrules-server \
            "${{ env.HELM_CHART_PATH }}" \
            --namespace "${{ env.KUBE_NAMESPACE }}" \
            --create-namespace \
            --set image.repository="${{ env.IMAGE_NAME }}" \
            --set image.tag="${{ github.sha }}" \
            --set image.pullPolicy=Always \
            --wait \
            --timeout 300s
