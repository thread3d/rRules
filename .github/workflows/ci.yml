name: CI

# The local gates are the contract (`make ci`, `make tck`); this workflow runs
# exactly those, so a green check here means the same thing as a green run on a
# developer's machine. Keeping them identical is deliberate: a CI that checks
# something different from the Makefile teaches people to distrust one of them.
on:
  # `master` is listed alongside `main` so a fork whose default branch still uses
  # the old name runs the same gates.
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  # `rust-toolchain.toml` says `channel = "stable"` (so a developer's rustup never
  # downloads a second toolchain), and rustup ranks the file above the toolchain the
  # action installed — which is how CI ended up compiling with clippy 1.99 and
  # failing on lints the pinned compiler does not have. The environment variable
  # outranks the file, so this is the pin that actually applies.
  RUSTUP_TOOLCHAIN: "1.94.1"

jobs:
  gates:
    name: Build, test, lint, format, frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # An exact compiler, not "whatever stable is today": a newer clippy or
      # rustfmt then fails CI in a commit that changed neither the lint config nor
      # the formatting. Bump this together with `rust-toolchain.toml`'s notes.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # One command, one definition of "green": build, test, clippy with
      # warnings-as-errors, fmt --check, frontend production build, vitest, and the
      # browser smoke test (`make e2e`), which needs a Chromium binary — the runner
      # image provides Chrome under `google-chrome`.
      - name: Run the gates
        run: make ci
        env:
          E2E_CHROME: google-chrome

      # The DMN conformance sweep is baseline-gated: a regression fails the build,
      # the one documented divergence does not.
      - name: DMN conformance baseline
        run: make tck

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      # The chart is otherwise only exercised during a deploy, where a broken
      # template looks like a deployment failure. Lint and render it here instead:
      # no cluster, no secrets, and a chart error is reported as a chart error.
      - name: Lint the chart
        run: helm lint helm/rrules-server

      - name: Render the default values
        run: helm template rrules helm/rrules-server > /dev/null

      - name: Render each environment overlay
        run: |
          for overlay in helm/rrules-server/values-*.yaml; do
            echo "rendering with $overlay"
            helm template rrules helm/rrules-server -f "$overlay" > /dev/null
          done

  image-context:
    name: Dockerfile build context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The image is the one artefact this pipeline cannot build (no container
      # runtime), so its COPY set and both stages are exercised here instead: a
      # Dockerfile that references a missing file, or misses one, fails CI rather
      # than a deploy.
      - name: Check the Dockerfile's stages
        run: make image-check

  spec-citations:
    name: Spec citations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The specification is evidence only while its `path:line` references point at the
      # code they name. An edit that moves code and leaves a citation behind is a claim
      # that quietly stops being true.
      - name: Check that every spec citation resolves
        run: make spec-citations

  verification:
    name: Requirement verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CodeWitness is not published: it is a jar installed from a source checkout, so a hosted
    # runner cannot obtain it. When the jar is supplied as a base64 secret this job runs the
    # claim; otherwise GitHub reports the job as skipped, which is the honest state — the
    # specification was not executed in CI on this run.
    # A job-level `if:` may not read `secrets` — GitHub rejects the whole workflow for it, which
    # is what happened when this job first landed: CI failed in 0 s before running anything. A
    # repository *variable* is allowed there; the jar itself is a secret, read at step level.
    if: vars.CODEWITNESS_ENABLED == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install CodeWitness
        run: |
          mkdir -p "$HOME/.local/lib/codewitness"
          printf '%s' "$CODEWITNESS_JAR_B64" | base64 -d > "$HOME/.local/lib/codewitness/codewitness.jar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        env:
          CODEWITNESS_JAR_B64: ${{ secrets.CODEWITNESS_JAR_B64 }}

      # The claim this project is built on: the specification is executed, not asserted. The
      # api half builds the application in-process, so this needs no server, port or secret.
      # `CARGO_NET_OFFLINE=false` is required — CodeWitness builds with `--offline` and cannot
      # resolve a lockfile newer than its index snapshot.
      - name: Verify the requirements
        env:
          CARGO_NET_OFFLINE: "false"
        run: make verify
