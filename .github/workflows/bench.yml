name: DMN Benchmarks

on:
  pull_request:
    branches: [master, main]
  schedule:
    # Run nightly at 02:00 UTC (regression gate)
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  # Thresholds for regression detection (percentage above baseline = fail).
  BENCH_RSS_THRESHOLD_PCT: "10"
  BENCH_ALLOC_THRESHOLD_PCT: "10"

jobs:
  bench-pr:
    name: Benchmark PR (informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run DMN benchmarks
        run: make bench

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-pr
          path: |
            target/release/.cargo-benchjson/
            engine/benches/snapshots/
          retention-days: 7

  bench-nightly:
    name: Benchmark Nightly (regression gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'bench-regression'))
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install jq (regression gate dependency)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate current snapshot and check for regressions
        run: make memcheck

      - name: Upload nightly results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-nightly
          path: |
            engine/benches/snapshots/
          retention-days: 30

      - name: Upload nightly results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-nightly
          path: |
            engine/benches/snapshots/
          retention-days: 30
