[package]
name = "engine_state"
version = "9.0.6"
edition = "2021"

[dependencies]
# Runtime dependency on the engine crate for DmnModel types used in persistence.
engine = { path = "../engine" }
serde_json = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
