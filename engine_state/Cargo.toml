[package]
name = "engine_state"
version = "9.0.53"
edition = "2021"

[dependencies]
# Runtime dependency on the engine crate for DmnModel types used in persistence.
engine = { path = "../engine" }
serde_json = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

# The PostgreSQL store is opt-in: no database driver is compiled unless a deployment asks for one.
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "json"], optional = true }

[features]
default = []
postgres = ["dep:sqlx"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
# A real PostgreSQL, downloaded and run in userspace: no Docker, no root, no preinstalled server.
# Only used by the ignored `postgres_store` tests, which `make db-test` runs.
pg-embed = "1.0.0"
