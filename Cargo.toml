[workspace]
members = ["engine", "api"]
resolver = "2"

[workspace.dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
mockall = "0.12"
serial_test = "3"
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.12"
gherkin = "0.16.0"
assert_cmd = "2.2.2"
wiremock = "0.6.5"
proptest = "1.11.0"
prometheus = { version = "0.13", features = ["process"] }
