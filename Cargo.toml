[workspace]
members = ["engine", "api", "engine_state"]
# `db_tests` is deliberately **not** a member: it depends on `pg-embed` to start a real PostgreSQL, and a
# workspace-wide build would then compile that tree — which is exactly what starved the requirement
# verification in 9.0.45-9.0.57. It is built on its own by `make db-test`.
exclude = ["db_tests"]
resolver = "2"

[workspace.dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
mockall = "0.12"
serial_test = "3"
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.12"
gherkin = "0.16.0"
assert_cmd = "2.2.2"
wiremock = "0.6.5"
proptest = "1.11.0"
# 0.13 pulled protobuf 2.x, which `cargo audit` reports as vulnerable (RUSTSEC-2024-0437).
prometheus = { version = "0.14", features = ["process"] }
