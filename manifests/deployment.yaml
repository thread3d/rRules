apiVersion: apps/v1
kind: Deployment
metadata:
  name: rrules-server
  labels:
    app: rrules
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rrules
  template:
    metadata:
      labels:
        app: rrules
    spec:
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
        readOnlyRootFilesystem: false
      containers:
        - name: rrules-server
          image: rrules/server:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            - name: RULE_STORAGE_PATH
              value: "/data/rules"
            - name: WATCH_RULES_DIR
              value: "true"
          volumeMounts:
            - name: rules-data
              mountPath: /data
              readOnly: false
            - name: config
              mountPath: /app/config
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: rules-data
          emptyDir: {}
        - name: config
          configMap:
            name: rrules-config
---
apiVersion: v1
kind: Service
metadata:
  name: rrules-server
  labels:
    app: rrules
spec:
  selector:
    app: rrules
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
