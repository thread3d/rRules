[package]
name = "api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rRules-server"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
actix-web = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde", "fast-rng"] }

[dev-dependencies]
criterion = "0.5"
