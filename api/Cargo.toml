[package]
name = "api"
version = "9.0.68"
edition = "2021"

[[bin]]
name = "rRules-server"
path = "src/main.rs"

[features]
default = []
# The PostgreSQL-backed DMN store; off by default so the API image carries no database driver.
postgres = ["engine_state/postgres", "dep:sqlx"]

[dependencies]
# Phase 23 (D-01 / L-01): enable all four pluggable-engine features on the
# api crate so `EngineRegistry::register_default_engines()` registers all
# four factories and `available_engines()` truthfully returns
# `["rete", "treat", "leaps", "phreak"]`. The non-rete features each pull
# `engine-rete` for shared types (engine/Cargo.toml), so listing all four
# is explicit and safe.
engine = { path = "../engine", features = ["engine-rete", "engine-treat", "engine-leaps", "engine-phreak"] }
engine_state = { path = "../engine_state" }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"], optional = true }
actix-web = { version = "4.4", features = ["macros", "ws"] }
actix-files = "0.6"
# CORS middleware — required for D-22-05's separate-host prod URL mode (VITE_API_URL
# absolute) where the browser blocks cross-origin requests without CORS headers.
# Verified ABSENT at plan time (RESEARCH Pitfall 2); added here so D-22-05 is real.
actix-cors = "0.7"
# WebSocket actor support for real-time metrics streaming (Plan 22-04,
# MON-02). `actix_web_actors::ws::start` performs the WS upgrade and provides
# `WebsocketContext` for the session actor (RESEARCH § Pattern 3). `actix`
# is the actor runtime trait (`Actor`/`StreamHandler`) — declared directly so
# `use actix::Actor;` resolves; it is already a transitive dep of actix-web.
actix-web-actors = "4"
actix = "0.13"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tracing = "0.1"
utoipa = { version = "4", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7", features = ["actix-web"] }
# JWT signing/validation (D-22-01). HS256 HMAC with the existing API_SECRET_KEY.
# Battle-tested standard crate (Keats; RESEARCH §Package Legitimacy: OK).
# `Validation::new(Algorithm::HS256)` pins the algorithm so `alg:none` is
# rejected (T-22-01) — never use `Validation::default()` without pinning.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# Phase 24 (Plan 24-02, D2 / Open Q4): promote the workspace-pinned
# `prometheus = { version = "0.13", features = ["process"] }` (Cargo.toml:15)
# into the api crate so `api::metrics::ExecutionCounters` can build its
# dedicated `Registry::new()` + labeled IntCounterVec / HistogramVec. NOT
# `optional` (the api crate always uses it); inherits the `process` feature
# from the workspace pin (harmless for the api crate). Mirrors
# engine/Cargo.toml:15 minus the `optional` gate. No new supply-chain surface
# (T-24-03-W1): the crate is already vetted by the engine.
prometheus = { workspace = true }
# Phase 27 (D-02): sharded concurrent HashMap for the SessionManager registry.
# Pinned per ROADMAP — NOT 7.0.0-rc2.
dashmap = "6.2.1"

[dev-dependencies]
criterion = "0.5"
# Test server for WS integration tests (Plan 22-04). Binds a random port and
# returns the SocketAddr so the raw TCP WS client can connect + assert the
# 101 handshake + a broadcast frame (P-4).
actix-test = "0.1"
# Singleton isolation for tests touching the process-global CoverageTracking
# (Plan 23-04 threat T-23-10): serial tests don't run concurrently with each
# other, so clear()+record() pairs aren't raced by sibling tests firing the
# same rule id.
serial_test = { workspace = true }

# The API's PostgreSQL tests live in the `db_tests` crate: `pg-embed` here would be compiled by every
# build and coverage pass of this crate, which pushed the requirement verification past its budget.
