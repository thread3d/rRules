  - id: SC-DMN-004
    requirement: DMN-004
    description: A null input never matches a unary test, and ranges/lists do match
    mode: single
    steps:
      - call: |
          let matches = |value: engine::data_types::Value, test: &str| -> String {
              let ast = engine::dmn::feel::parser::parse_simple_unary_tests(test);
              match engine::dmn::feel::eval::eval_in_unary_test(value, &ast) {
                  Some(true) => String::from("true"),
                  Some(false) => String::from("false"),
                  None => String::from("null"),
              }
          };
          let value = format!(
              "{}|{}|{}|{}|{}",
              matches(engine::data_types::Value::Null, "> 3"),
              matches(engine::data_types::Value::Integer(5), "[1..10]"),
              matches(engine::data_types::Value::Integer(11), "(1..10)"),
              matches(engine::data_types::Value::Integer(5), "1, 5, 9"),
              matches(engine::data_types::Value::String("a".to_string()), "\"a\", \"b\"")
          );
    observation: "value"
    invariant: 'observation == "null|true|false|true|true"'
    cases: 1
    seed: 1

  - id: SC-DMN-005
    requirement: DMN-005
    description: A dependency cycle is reported as an error, not a hang
    mode: single
    steps:
      - call: |
          let cyclic = concat!(
              "<?xml version=\"1.0\" encoding=\"UTF-8\"?>",
              "<definitions xmlns=\"https://www.omg.org/spec/DMN/20230324/MODEL/\" id=\"defs1\" name=\"cycle\" namespace=\"http://example.com/cycle\">",
              "<decision id=\"a\" name=\"a\"><variable name=\"a\"/>",
              "<informationRequirement id=\"r1\"><requiredDecision href=\"#b\"/></informationRequirement>",
              "<literalExpression id=\"l1\"><text>b + 1</text></literalExpression></decision>",
              "<decision id=\"b\" name=\"b\"><variable name=\"b\"/>",
              "<informationRequirement id=\"r2\"><requiredDecision href=\"#a\"/></informationRequirement>",
              "<literalExpression id=\"l2\"><text>a + 1</text></literalExpression></decision>",
              "</definitions>"
          );
          let model = engine::dmn::parser::parse_dmn(cyclic).expect("parse cyclic model");
          let cache = engine::dmn::feel::cache::FeelAstCache::new();
          let shared = std::sync::Arc::new(std::sync::RwLock::new(
              engine::dmn::evaluator::SharedDmnModel::new(model, cache),
          ));
          let evaluator = engine::dmn::evaluator::DecisionEvaluator::new(shared);
          let outcome = evaluator.evaluate(
              "a",
              engine::dmn::evaluator::EvaluateRequest { inputs: std::collections::HashMap::new(), trace: false },
          );
          let value = outcome.is_err();
    observation: "value"
    invariant: "observation"
    cases: 1
    seed: 1

  - id: SC-SYS-002
    requirement: SYS-002
    description: Malformed FEEL and DMN input produce errors, never a panic
    mode: single
    steps:
      - call: |
          let scope = engine::dmn::feel::eval::Scope::empty();
          let mut survived = true;
          for garbage in [
              "(((((",
              "if then else",
              "1 +",
              "\"unterminated",
              "for x in return x",
              "a b c d",
              "}}}}",
              "\\u{0}",
          ] {
              let ast = engine::dmn::feel::parser::parse_expression(garbage);
              let _ = engine::dmn::feel::eval::evaluate(&ast, &scope);
              survived = true;
          }
          let malformed_dmn = "<definitions><decision id=\"x\"";
          let dmn_ok = engine::dmn::parser::parse_dmn(malformed_dmn).is_err();
          let value = format!("{}|{}", survived, dmn_ok);
    observation: "value"
    invariant: 'observation == "true|true"'
    cases: 1
    seed: 1

  - id: SC-SYS-003
    requirement: SYS-003
    description: The coverage singleton can be cleared so tests stay independent
    mode: single
    steps:
      - call: |
          use engine::engine::registry::ExecutionEngine;
          let tracker = engine::monitoring::coverage::CoverageTracking;
          tracker.clear();
          let before = tracker.get_summary().total_rules;

          let mut engine = engine::engine::rete::ReteEngine::new();
          let mut payload = std::collections::HashMap::new();
          payload.insert("score".to_string(), engine::data_types::Value::Integer(0));
          engine.insert_fact(engine::fact::Fact::new("scorecard", payload)).expect("insert");
          let mut set = engine::rules::RuleSet::new();
          let mut rule = engine::rules::Rule::new("r1", "r1");
          rule.actions = vec![engine::rules::Action::UpdateFact {
              id: "scorecard".to_string(),
              fields: std::collections::HashMap::from([(
                  "score".to_string(),
                  engine::rules::Expression::Literal(engine::data_types::Value::Integer(1)),
              )]),
          }];
          set.add_rule(rule).expect("rule");
          engine.load_ruleset(&set).expect("load");
          let _ = engine.execute();
          let after_run = tracker.get_summary().total_rules;

          tracker.clear();
          let after_clear = tracker.get_summary().total_rules;
          let value = format!("{}|{}|{}", before, after_run, after_clear);
    observation: "value"
    invariant: 'observation == "0|1|0"'
    cases: 1
    seed: 1
