[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
git2 = "0.21.0"
prometheus = { workspace = true, optional = true }
utoipa = { version = "4", features = ["chrono", "uuid"] }
# DMN 1.5 XML parser/exporter (Phase 29+) — streaming NsReader/Writer, multi-namespace.
# Supply-chain verified 2026-07-06 (Task 1 gate): repo tafia/quick-xml, 322M downloads.
quick-xml = { version = "0.40", features = ["serialize"] }
# FEEL Decimal128 numeric domain (Phase 29+). Supply-chain verified 2026-07-06 (Task 1 gate):
# repo paupino/rust-decimal, 115M downloads. Features: serde (IR (de)serialization),
# macros (decimal! literals), maths (sqrt/ln/... for Phase 31 built-ins).
rust_decimal = { version = "1.42", features = ["serde", "macros", "maths"] }
# FEEL IANA timezone database (Phase 30+). Supply-chain verified 2026-07-07 per
# 30-RESEARCH.md Package Legitimacy Audit: repo chronotope/chrono-tz (same
# maintainer org as chrono), ~9 yrs, tens of M downloads, OK/Approved — not
# [SUS]/[SLOP]. `serde` feature enables Serialize/Deserialize for `chrono_tz::Tz`
# so `DateTimeValue::Iana(DateTime<chrono_tz::Tz>)` can derive serde.
chrono-tz = { version = "0.10.4", features = ["serde"] }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
mockall = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tempfile = { workspace = true }
gherkin = { workspace = true }
assert_cmd = { workspace = true }
wiremock = { workspace = true }
proptest = { workspace = true }

[features]
default = []
metrics = ["prometheus"]
engine-rete = []
# Enable individual engine implementations (all require engine-rete as dependency)
engine-treat = ["engine-rete"]
engine-leaps = ["engine-rete"]
engine-phreak = ["engine-rete"]
history = []
