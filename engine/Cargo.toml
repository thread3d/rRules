[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
mockall = "0.12"
serial_test = "3"
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.12"
gherkin = "0.16.0"
assert_cmd = "2.2.2"
wiremock = "0.6.5"
proptest = "1.11.0"
