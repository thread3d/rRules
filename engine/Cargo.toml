[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
git2 = "0.21.0"
prometheus = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
mockall = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tempfile = { workspace = true }
gherkin = { workspace = true }
assert_cmd = { workspace = true }
wiremock = { workspace = true }
proptest = { workspace = true }

[features]
default = []
metrics = ["prometheus"]
engine-rete = []
# Enable individual engine implementations (all require engine-rete as dependency)
engine-treat = ["engine-rete"]
engine-leaps = ["engine-rete"]
engine-phreak = ["engine-rete"]
