[package]
name = "engine"
version = "9.0.6"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
git2 = "0.21.0"
prometheus = { workspace = true }
utoipa = { version = "4", features = ["chrono", "uuid"] }
# DMN 1.5 XML parser/exporter (Phase 29+) — streaming NsReader/Writer, multi-namespace.
# Supply-chain verified 2026-07-06 (Task 1 gate): repo tafia/quick-xml, 322M downloads.
quick-xml = { version = "0.40", features = ["serialize"] }
# FEEL Decimal128 numeric domain (Phase 29+). Supply-chain verified 2026-07-06 (Task 1 gate):
# repo paupino/rust-decimal, 115M downloads. Features: serde (IR (de)serialization),
# macros (decimal! literals), maths (sqrt/ln/... for Phase 31 built-ins).
rust_decimal = { version = "1.42", features = ["serde", "macros", "maths"] }
# FEEL IANA timezone database (Phase 30+). Supply-chain verified 2026-07-07 per
# 30-RESEARCH.md Package Legitimacy Audit: repo chronotope/chrono-tz (same
# maintainer org as chrono), ~9 yrs, tens of M downloads, OK/Approved — not
# [SUS]/[SLOP]. `serde` feature enables Serialize/Deserialize for `chrono_tz::Tz`
# so `DateTimeValue::Iana(DateTime<chrono_tz::Tz>)` can derive serde.
chrono-tz = { version = "0.10.4", features = ["serde"] }
# FEEL AST cache (Phase 31+). Supply-chain verified 2026-07-07 per
# 31-RESEARCH.md Package Legitimacy Audit: repo xacrimon/dashmap, ~7 yrs,
# ~5M downloads/wk, OK/Approved. Already used in v5.0 SessionManager.
dashmap = "6.2.1"
# FEEL string built-ins (Phase 31+): `replace`/`matches`/`split` (DMN 1.5
# §10.3.4.2.2). FEEL regex is XQuery 1.0 / XPath 2.0 FO; the Rust `regex`
# crate covers the TCK-exercised subset (31-RESEARCH.md Pitfall 7).
# Supply-chain verified: repo rust-lang/regex, ~12 yrs, ~15M downloads/wk, OK.
regex = "1.12.4"
# Data-parallel DRD evaluation (Phase 39 / PERF-09). Used only for CPU-bound
# level-by-level evaluation of independent decisions within a single
# `DecisionEvaluator::evaluate` call. Supply-chain: rayon is maintained by
# crates.io team members, ~10 yrs, ~30M downloads/wk, OK/Approved.
rayon = "1.10"

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
mockall = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tempfile = { workspace = true }
gherkin = { workspace = true }
assert_cmd = { workspace = true }
wiremock = { workspace = true }
proptest = { workspace = true }
arbitrary = "1.0"
criterion-cycles-per-byte = "0.8"

[features]
# The four Rete-family engines are the crate's core surface, so they are on by
# default: `cargo test -p engine` and `cargo build -p engine` must exercise the
# real engines rather than a feature-less shell. Disable individual engines with
# `--no-default-features` when a lighter build is wanted.
default = ["engine-rete", "engine-treat", "engine-leaps", "engine-phreak"]
engine-rete = []
# Enable individual engine implementations (all require engine-rete as dependency)
engine-treat = ["engine-rete"]
engine-leaps = ["engine-rete"]
engine-phreak = ["engine-rete"]
history = []

# Benchmark target for the DMN subsystem (Phase 36+).
# `harness = false` is REQUIRED for criterion: the bench file defines its own
# `main` via criterion_main!, and the default libtest harness (harness = true)
# would shadow it and run zero benchmarks. PERF-06 corrected this from
# harness = true (under which `make bench` silently measured nothing).
[[bench]]
name = "dmn_benchmarks"
harness = false

# Memory baseline binary — runs once to capture RSS/allocations against the v6.0 corpus,
# writes a JSON snapshot to engine/benches/snapshots/v6.0-baseline.json.
[[bin]]
name = "memory_baseline"
path = "tools/memory_baseline.rs"
