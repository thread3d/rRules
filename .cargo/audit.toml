# `cargo audit` configuration.
#
# `make audit` fails on any advisory that is not listed here, and as of 9.0.90 it audits **all three
# lockfiles** in this repository — `Cargo.lock`, `db_tests/Cargo.lock` and `engine/fuzz/Cargo.lock` —
# because the two excluded workspaces carry their own and nothing audited them before that release.
# Each entry is a decision with a reason, not a silencer: `SECURITY.md` explains the assessment behind
# it. Entries are removed by the release that removes the crate — 9.0.90 dropped seven this way (the
# `zip` group, closed by moving both `zip` paths to zip 9, and the `zstd 0.13` group, which left the
# tree with them).

[advisories]
ignore = [
    # --- Unreachable at runtime: the API verifies HS256 only (`api/src/middleware/auth.rs`) ---------
    # `jsonwebtoken` compiles its RSA and ECDSA support unconditionally under the `rust_crypto`
    # feature, so `rsa` -> `elliptic-curve` -> `crypto-bigint` are linked while no code path reaches
    # them (`sqlx-mysql`, an optional feature of an optional dependency, names `rsa` for the same
    # reason). RUSTSEC-2023-0071 has no fixed release; removing them means switching jsonwebtoken's
    # crypto backend to `aws_lc_rs` (a C toolchain in the image) or replacing the crate — recorded as
    # work, not done quietly.
    "RUSTSEC-2023-0071", # rsa: Marvin attack (unfixed upstream)
    "RUSTSEC-2026-0387", # crypto-bigint: timing variability (via elliptic-curve, same path)

    # --- Pinned by actix-http, not by this project ------------------------------------------------
    # `actix-http` 3.20.3 — the version that closed five request-path advisories in 9.0.89 — still
    # resolves `h2 0.3.27`. Nothing in this repository can patch a dependency of a dependency; this
    # entry is what the next `actix-http` bump has to clear, and `cargo tree -i h2@0.3.27` is the
    # measurement. (The `zstd 0.13` entries that sat here went in 9.0.90: that version left the tree
    # with `zip` 8, and `actix-http` 3.20.3 itself resolves `zstd 0.14`.)
    "RUSTSEC-2026-0258", # h2: unbounded empty DATA frames

    # --- In the lockfile, absent from every build this repository makes ---------------------------
    # `rust_decimal`'s optional `rkyv` feature and `pg-embed`'s optional `sqlx` feature resolve into
    # the lockfile — a lockfile is feature-independent — but no feature this tree enables compiles
    # either, and `cargo tree -i <crate>` finds no parent in the resolved graph. They are listed
    # rather than suppressed globally so that enabling either feature meets a decision, not a
    # surprise.
    "RUSTSEC-2026-0235", # rkyv: archive validation can read out of bounds (optional rust_decimal feature)
    "RUSTSEC-2026-0381", # webpki-roots: bundles distrusted CAs (optional pg-embed sqlx feature)
]
